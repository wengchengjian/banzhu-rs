[package]
name = "banzhu-spider"
version = "0.4.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "banzhu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
config = "0.14"
chrono = "0.4"
regex = "1"
lazy_static = "1.5"
scraper = "0.21"
rusqlite = { version = "0.39", features = ["bundled", "load_extension", "vtab"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
rand = "0.9"
# crate 独有依赖
humantime = "2.1"
itertools = "0.12"
rand_core = { version = "0.9.0-beta.0", features = ["std"] }
md5 = "0.7"
base64 = "0.22"
cbc = "0.1"
aes = "0.8"
cipher = "=0.4.4"
encoding = "0.2"
ctrlc = { version = "3.4", features = ["termination"] }
sqlite-simple-tokenizer = "0.6"
toml = "0.8"
tokio-cron-scheduler = "0.13"
zip = "2"
rust-embed = { version = "8", features = ["axum"] }
mime_guess = "2"
ts-rs = { version = "10", features = ["chrono-impl", "no-serde-warnings"] }
thiserror = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
# wisp 爬虫框架（本地 path 依赖，可同步修改 wisp 源码）
wisp = { path = "../wisp" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
futures = "0.3"



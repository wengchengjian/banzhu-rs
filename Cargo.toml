[workspace]
members = ["crates/banzhu-spider"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# 共享依赖版本管理
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
config = "0.14"
chrono = "0.4"
regex = "1"
lazy_static = "1.5"
scraper = "0.21"
wreq = { version = "5", features = ["cookies", "zstd", "json"] }
wreq-util = "*"
headless_chrome = "1.0"
rusqlite = { version = "0.38", features = ["bundled", "load_extension", "vtab"] }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
rand = "0.9"

# ─── 目标站点 ─────────────────────────────────────────────────────────────────
root_url = "https://www.bz555555555.com"

# ─── Web 服务 ─────────────────────────────────────────────────────────────────
[server]
port = 3000

# ─── 爬虫核心 ─────────────────────────────────────────────────────────────────
[spider]
max_concurrent_tasks = 16 # 章节并发下载数
retry_attempts = 3        # 请求失败重试次数
retry_delay_ms = 100      # 重试初始退避 (ms)，指数递增
request_timeout_secs = 15 # 单次请求超时

# ─── 代理 ─────────────────────────────────────────────────────────────────────
[spider.proxy]
enabled = false
# 支持 http/https/socks5 协议
# 示例: "http://127.0.0.1:7890" 或 "socks5://127.0.0.1:1080"
url = ""

# ─── 定时爬取 ─────────────────────────────────────────────────────────────────
[cron]
enabled = true
schedule = "0 */6 * * *" # cron 表达式：每 6 小时
pages_limit = 50         # 单次最多爬取列表页数
book_concurrency = 4     # 书籍并发下载数

# ─── Cloudflare 绕过 ──────────────────────────────────────────────────────────
[cf_bypass]
cookie_ttl_secs = 1200    # cf_clearance 缓存有效期 (默认 20 分钟)
chrome_timeout_secs = 120 # 等待 CF 验证通过的最大时间
passive_wait_secs = 2     # 被动等待 JS Challenge 自动解决
click_interval_secs = 2   # Turnstile 点击尝试间隔
headless = false          # Chrome 无头模式 (无 GUI 环境设为 true)

# ─── 爬虫引擎（wisp 迁移期双开关）─────────────────────────────────────────────
[engine]
backend = "wisp"   # "wisp"（新）或 "legacy"（旧 BanzhuSpider 路径，已删除）

# ─── 目标站点 ───────────────────────────────────────────────────────────────
root_url = "https://www.bz555555555.com"

# ─── 数据存储 ───────────────────────────────────────────────────────────────
[storage]
db_path = "banzhu.db"

# ─── Web 服务 ───────────────────────────────────────────────────────────────
[server]
port = 4567

# ─── 爬取调度 ───────────────────────────────────────────────────────────────
[cron]
enabled = true
schedule = "0 */6 * * *"       # cron 表达式：每 6 小时
pages_limit = 1                # 单次最多爬取列表页数
book_concurrency = 4           # 书籍并发下载数

# ─── wisp 引擎 ──────────────────────────────────────────────────────────────
[wisp]
fetch_mode = "auto"            # auto | http | stealth | dynamic
max_pages = 5000               # 引擎级总页数上限
download_delay_ms = 500        # 请求间隔（毫秒）
obey_robots = false

[wisp.proxy]
enabled = false
# 支持 http/https/socks5 协议
# 示例: "http://127.0.0.1:7890" 或 "socks5://127.0.0.1:1080"
url = "http://127.0.0.1:7897"

[wisp.stealth]
headless = false               # false=可见浏览器（绕过 CF 检测）
challenge_timeout_secs = 60
human_mode = true
cf_cookie_ttl_secs = 1800     # CF 会话缓存有效期（秒），默认 30 分钟

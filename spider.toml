# ─── 目标站点 ─────────────────────────────────────────────────────────────────
root_url = "https://www.bz555555555.com"

# ─── Web 服务 ─────────────────────────────────────────────────────────────────
[server]
port = 3000

# ─── 爬虫核心 ─────────────────────────────────────────────────────────────────
[spider]
max_concurrent_tasks = 16 # 章节并发下载数
retry_attempts = 3        # 请求失败重试次数
retry_delay_ms = 100      # 重试初始退避 (ms)，指数递增
request_timeout_secs = 15 # 单次请求超时

# ─── 代理 ─────────────────────────────────────────────────────────────────────
[spider.proxy]
enabled = false
# 支持 http/https/socks5 协议
# 示例: "http://127.0.0.1:7890" 或 "socks5://127.0.0.1:1080"
url = "http://127.0.0.1:7897"

# ─── 定时爬取 ─────────────────────────────────────────────────────────────────
[cron]
enabled = true
schedule = "0 */6 * * *" # cron 表达式：每 6 小时
pages_limit = 50         # 单次最多爬取列表页数
book_concurrency = 4     # 书籍并发下载数
